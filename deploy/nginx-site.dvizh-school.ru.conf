# Example HTTP vhost only. Before enabling HTTPS confirm domain and cert issuance.
# Do not replace nginx.conf or unrelated server blocks.
server {
    listen 80;
    listen [::]:80;
    server_name site.dvizh-school.ru;
    root /var/www/dvizh-site/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
